[project]
name = "ohrats-qff2026-uottawa"
version = "0.1.0"
description = "FlyWalk: classical and quantum walks on a male fruit-fly connectome"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit[visualization]==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-machine-learning==0.9.1",
    "qiskit-ibm-runtime==0.50.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "jupyterlab",
    "ipykernel",
    "numpy==2.5.3",
    "qiskit-nature>=0.8,<0.9",
    "pyscf>=2.11,<3",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
