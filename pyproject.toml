[project]
name = "ohrats-qff2026-uottawa"
version = "0.1.0"
description = "Ontario wildfire analysis with weather and annual forest land cover"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
data = ["rasterio>=1.4,<2", "numpy==2.5.3", "Pillow==12.3.0"]
analysis = [
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
]
quantum = [
    "qiskit==2.5.2",
    "qiskit-machine-learning==0.9.1",
    "qiskit-addon-sqd==0.13.1",
]
hardware = ["qiskit-ibm-runtime==0.50.0", "python-dotenv>=1.2.4"]
mitigation = ["qiskit-aer==0.17.2"]
notebook = ["jupyterlab", "ipykernel"]
