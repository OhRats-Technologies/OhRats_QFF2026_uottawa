server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Stable asset URLs must not retain old modules across a deployment.
    # max-age=0 alone can be raised by Cloudflare's Browser Cache TTL.
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /web/demo { return 302 /; }
    location = /web/demo/ { return 302 /; }
    location = /demo { return 302 /; }
    location = /demo/ { return 302 /; }
    location = /web/presentation { return 302 /presentation/; }
    location = /web/presentation/ { return 302 /presentation/; }
    location ~ (^|/)\. { return 404; }

    # The deck imports shared game drawing modules through ../demo/.
    location /demo/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
