<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fireline: an audited Ontario wildfire benchmark, quantum kernels and measured limits.">
  <title>Fireline · Ontario wildfire research</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #081b1c; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    .semantic { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main aria-label="Fireline research presentation">
    <canvas id="stage" tabindex="0" role="img" aria-describedby="description"></canvas>
    <div class="semantic">
      <h1 id="description"></h1>
      <p id="announcement" aria-live="polite"></p>
      <nav id="accessible-controls" aria-label="Presentation controls"></nav>
      <article id="accessible-notes"></article>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
