<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Fireline</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #081b1c;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #controls,
      #status {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #controls button {
        position: relative;
      }
      noscript {
        color: #aed6b6;
        font: 16px monospace;
      }
    </style>
  </head>
  <body>
    <canvas
      aria-label="Fireline quantum engineering workbench"
      role="img"
    ></canvas>
    <nav id="controls" aria-label="Game controls"></nav>
    <div id="status" role="status" aria-live="polite"></div>
    <noscript>Fireline needs JavaScript.</noscript>
    <script type="module" src="canvas/main.js"></script>
  </body>
</html>
